[package]
name = "chesscore"
version = "0.1.0"
edition = "2021"

[lib]
name = "chesscore"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.22.6", features = ["extension-module"] }
# Proven bitboard movegen (perft-verified); we write only FFI glue, never
# move rules by hand. Pinned exact: movegen must not float under us.
chess = "=3.2.0"
